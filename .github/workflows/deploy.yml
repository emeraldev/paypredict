# Two-environment deploy to Fly.io.
#
# STAGING — auto-deploys on every merge to `main` after CI goes
# green. Fast feedback for us, where the demo tenants live, where
# Lumo-style prospect clicks land.
#
# PRODUCTION — manual promotion. A human triggers this workflow
# from the Actions UI after smoke-checking staging; it builds the
# current `main` tip and deploys to the pp-prod-* apps. Kalene
# (and future paying tenants) sit behind this.
#
# Prereqs (one-time, documented in docs/deployment-guide.md):
#   1. Fly.io apps: pp-staging-api, pp-staging-dashboard,
#      pp-prod-api, pp-prod-dashboard — all created manually in
#      the jnb region.
#   2. Fly Redis: pp-staging-redis, pp-prod-redis (jnb).
#   3. Neon project with two branches: main (prod) and staging.
#   4. Secrets set per-app via `fly secrets set -a <app>` for
#      DATABASE_URL / REDIS_URL / JWT_SECRET_KEY / SECRET_KEY /
#      CORS_ORIGINS / PUBLIC_API_URL.
#   5. Repo secret FLY_API_TOKEN — generated via `fly tokens
#      create deploy` — one token covers both environments.

name: Deploy to Fly.io

on:
  # Auto path: whenever the CI workflow finishes successfully on
  # main, deploy to staging. workflow_run is the sanctioned
  # cross-workflow dependency.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

  # Manual path: pick which env + which app(s) to deploy. The
  # default is staging / both — the common hot-fix case. Prod
  # requires an explicit choice from the dropdown so nobody
  # accidentally pushes to prod without smoke-checking staging.
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      target:
        description: "Which app(s) to deploy"
        required: true
        default: "both"
        type: choice
        options: [both, api, dashboard]

concurrency:
  # One deploy per environment at a time. Different envs are
  # independent, so a staging deploy doesn't block a prod push.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ---- Environment resolution --------------------------------------
  #
  # workflow_run has no inputs — it always targets staging on
  # success. workflow_dispatch carries explicit inputs. This job
  # collapses both triggers into a single `environment`/`target`
  # pair the downstream jobs can read.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      target: ${{ steps.pick.outputs.target }}
      should_run: ${{ steps.pick.outputs.should_run }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              echo "target=both" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    needs: resolve
    if: >-
      needs.resolve.outputs.should_run == 'true'
      && (needs.resolve.outputs.target == 'both' || needs.resolve.outputs.target == 'api')
    runs-on: ubuntu-latest
    # GitHub Environments gate — put a reviewer requirement on
    # `production` in the repo's Environment settings to force a
    # second-pair-of-eyes on every prod deploy. Staging has no
    # gate, so it just flows through.
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Pick config file
        id: cfg
        run: |
          if [[ "${{ needs.resolve.outputs.environment }}" == "production" ]]; then
            echo "config=api/fly.prod.toml" >> "$GITHUB_OUTPUT"
          else
            echo "config=api/fly.staging.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy API
        run: flyctl deploy --config "${{ steps.cfg.outputs.config }}" --remote-only ./api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-dashboard:
    needs: [resolve, deploy-api]
    # `needs: deploy-api` so the dashboard deploys only after the
    # API — the client bundle caches NEXT_PUBLIC_API_URL and we
    # don't want a cold-first-request landing on a backend that's
    # still migrating. If deploy-api was skipped because target=
    # dashboard, GitHub treats `needs` as satisfied (the job
    # didn't fail; it was conditionally skipped), so this chain
    # still runs.
    if: >-
      always()
      && needs.resolve.outputs.should_run == 'true'
      && needs.deploy-api.result != 'failure'
      && (needs.resolve.outputs.target == 'both' || needs.resolve.outputs.target == 'dashboard')
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Pick config file
        id: cfg
        run: |
          if [[ "${{ needs.resolve.outputs.environment }}" == "production" ]]; then
            echo "config=dashboard/fly.prod.toml" >> "$GITHUB_OUTPUT"
          else
            echo "config=dashboard/fly.staging.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy dashboard
        run: flyctl deploy --config "${{ steps.cfg.outputs.config }}" --remote-only ./dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
