name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paypredict
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: paypredict_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U paypredict"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create test database
        env:
          PGPASSWORD: localdev
        run: |
          psql -h localhost -p 5434 -U paypredict -d paypredict_dev \
            -c "CREATE DATABASE paypredict_test OWNER paypredict;"

      - name: Run pytest
        # Tests auto-migrate the test DB via a session-scoped fixture.
        # Each test runs in a transaction that rolls back on teardown.
        # REDIS_URL matches the docker-compose port mapping (host:6380) so
        # the rate-limit tests can talk to the service container.
        env:
          REDIS_URL: redis://localhost:6380/0
        run: pytest -q --tb=short

  migrations:
    name: Migrations (round-trip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paypredict
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: paypredict_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U paypredict"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The full migration stack must round-trip: apply everything, roll
      # back to an empty DB, apply everything again. This catches every
      # class of downgrade bug (data loss, constraint mismatch, orphan
      # native enum types, enum shape drift) — the realistic emergency-
      # rollback scenario for a real customer, plus the nuclear reset
      # case where prod is rebuilt from scratch.
      #
      # `all` is the sentinel that disarms every per-revision guard in
      # the codebase — see `app/migration_guards.py`. Empty CI DB means
      # most guards no-op anyway, but this covers guards that fire on
      # bootstrap rows. Production operators name specific revisions
      # per operation (`FORCE_DESTRUCTIVE_DOWNGRADE=<rev>`), never `all`.
      - name: Round-trip full migration stack (up → down base → up)
        env:
          DATABASE_URL: postgresql+asyncpg://paypredict:localdev@localhost:5434/paypredict_dev
          FORCE_DESTRUCTIVE_UPGRADE: "all"
          FORCE_DESTRUCTIVE_DOWNGRADE: "all"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Production build validates types and surfaces config errors.
        run: npm run build

  # Final gate so branch protection can require a single "CI" check
  # rather than every individual job.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.migrations.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded"
